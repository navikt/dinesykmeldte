fragment PreviewSoknad on PreviewSoknad {
  __typename
  ... on BasePreviewSoknad {
    id
    sykmeldingId
    fom
    tom
    perioder {
      ...Soknadperiode
    }
  }
  ... on PreviewNySoknad {
    lest
    ikkeSendtSoknadVarsel
    ikkeSendtSoknadVarsletDato
  }
  ... on PreviewSendtSoknad {
    lest
    sendtDato
    korrigererSoknadId
  }
}

fragment Dialogmote on Dialogmote {
  hendelseId
  mottatt
  tekst
}

fragment Oppfolgingsplan on Oppfolgingsplan {
  hendelseId
  mottatt
  tekst
}

fragment PreviewSykmeldt on PreviewSykmeldt {
  fnr
  navn
  orgnummer
  orgnavn
  friskmeldt
  narmestelederId
  sykmeldinger {
    ...Sykmelding
  }
  previewSoknader {
    ...PreviewSoknad
  }
  dialogmoter {
    ...Dialogmote
  }
  oppfolgingsplaner {
    ...Oppfolgingsplan
  }
}

query MineSykmeldte {
  mineSykmeldte {
    ...PreviewSykmeldt
  }
}
